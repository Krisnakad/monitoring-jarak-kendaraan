<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring Jarak Kendaraan</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
    padding:0;
}

header{
    background:#1e293b;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.container{
    margin-top:40px;
}

.card{
    background:#1e293b;
    width:350px;
    margin:auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.5);
}

.label{
    font-size:20px;
    margin-bottom:10px;
}

.value{
    font-size:55px;
    font-weight:bold;
    color:#38bdf8;
}

.status{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    padding:10px;
    border-radius:10px;
}

.aman{
    background:green;
}

.waspada{
    background:orange;
}

.bahaya{
    background:red;
}

.footer{
    margin-top:20px;
    font-size:14px;
    color:#cbd5e1;
}

</style>
</head>

<body>

<header>
🚗 Monitoring Jarak Kendaraan
</header>

<div class="container">

    <div class="card">

        <div class="label">
            Jarak Kendaraan
        </div>

        <div class="value" id="jarak">
            0 cm
        </div>

        <div id="status" class="status">
            Menunggu Data...
        </div>

    </div>

    <div class="footer">
        Data Realtime Firebase
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyDo0fgK7vyn1GHovnWr3AtX0Q2bJ90XZJ4",

    authDomain: "jarak-kendaraan.firebaseapp.com",

    databaseURL:
    "https://jarak-kendaraan-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "jarak-kendaraan",

    storageBucket:
    "jarak-kendaraan.firebasestorage.app",

    messagingSenderId: "779527337433",

    appId:
    "1:779527337433:web:9136bb73884878f9e695c8",

    measurementId: "G-8HLXVJRX3N"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

// PATH FIREBASE SESUAI PROGRAM ESP32
const monitoringRef =
ref(db, "MonitoringKendaraan");

onValue(monitoringRef, (snapshot)=>{

    const data = snapshot.val();

    if(data){

        document.getElementById("jarak").innerHTML =
        Number(data.jarak).toFixed(1) + " cm";

        let statusBox =
        document.getElementById("status");

        statusBox.innerHTML = data.status;

        statusBox.className = "status";

        if(data.status === "AMAN"){
            statusBox.classList.add("aman");
        }

        else if(data.status === "WASPADA"){
            statusBox.classList.add("waspada");
        }

        else if(data.status === "BAHAYA"){
            statusBox.classList.add("bahaya");
        }

    }

});

</script>

</body>
</html>
